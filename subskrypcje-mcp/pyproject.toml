[project]
name = "subskrypcje-mcp"
version = "0.1.0"
description = "Serwer MCP z danymi o subskrypcjach wykrytych na wyciągu bankowym"
readme = "README.md"
authors = [
    { name = "Krzysztof", email = "programowanie.krzysiek@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0",
    "subskrypcje",
]

[project.scripts]
subskrypcje-mcp = "subskrypcje_mcp:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
subskrypcje = { git = "https://github.com/kmprograms/subscriptions-spec-and-skill", subdirectory = "skill-pro" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
