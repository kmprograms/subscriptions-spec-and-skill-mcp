[project]
name = "subskrypcje"
version = "0.1.0"
description = "Wykrywanie subskrypcji na wyciągu bankowym w CSV"
readme = "README.md"
authors = [
    { name = "Krzysztof", email = "programowanie.krzysiek@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "structlog>=26.1.0",
]

[project.scripts]
subskrypcje = "subskrypcje.main:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
